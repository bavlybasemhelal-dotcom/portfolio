<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta name="robots" content="noindex,nofollow">
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="YOGEN — Custom software applications. Ideas for a brighter tomorrow.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="YOGEN">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="icons/yogen-mark.svg"/>

  <meta property="og:title" content="YOGEN — Custom software applications">
  <meta property="og:description" content="Ideas for a brighter tomorrow. Explore YOGEN work and start your project request.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="sharing/yogen-logo.png">
  <meta name="twitter:card" content="summary">
  <title>YOGEN — Custom software applications</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <style>
    html,body{margin:0;background:#f7f9fd;color:#101e36}
    @media(prefers-color-scheme:dark){html,body{background:#081120;color:#f3f6fc}}
    #yogen-loading{position:fixed;inset:0;display:grid;place-content:center;font:600 24px system-ui;text-align:center;letter-spacing:4px}
    #yogen-loading small{font-size:13px;letter-spacing:0;margin-top:12px}
  </style>
  <script>
    try { const theme=JSON.parse(localStorage.getItem('flutter.theme'));
      if(theme==='dark'||theme==='light') {const dark=theme==='dark';document.documentElement.style.background=dark?'#081120':'#f7f9fd';document.body.style.background=dark?'#081120':'#f7f9fd';document.body.style.color=dark?'#f3f6fc':'#101e36';}
    } catch(_) {}
    window.addEventListener('flutter-first-frame',()=>document.getElementById('yogen-loading')?.remove());
  </script>
  <div id="yogen-loading" aria-label="YOGEN loading">YOGEN<small>Ideas for a brighter tomorrow</small></div>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
