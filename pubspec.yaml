name: yogen_portfolio
description: "YOGEN multiplatform foundation, content services and role-based access."
publish_to: 'none'
version: 1.0.3+13

environment:
  sdk: ^3.11.0

dependencies:
  cloud_firestore: ^6.10.0
  crypto: 3.0.7
  file_picker: ^13.1.0
  firebase_auth: ^6.7.0
  firebase_core: ^4.15.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  flutter_secure_storage: 11.2.0
  go_router: ^17.5.0
  http: ^1.6.0
  image: 4.10.1
  path_provider: ^2.1.6
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3
  video_player: ^2.11.1
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - planning-assets/yogen-logo-horizontal.png
    - assets/images/team/
    - assets/images/projects/alban-elra3y/
  fonts:
    - family: PlexArabic
      fonts:
        - asset: assets/fonts/ibmplexsansarabic/IBMPlexSansArabic-Regular.ttf
        - asset: assets/fonts/ibmplexsansarabic/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
    - family: PlexSans
      fonts:
        - asset: assets/fonts/ibmplexsans/IBMPlexSans[wdth,wght].ttf
